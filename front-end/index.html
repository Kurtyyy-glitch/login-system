<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="card">

        <!-- LOGIN -->

        <div id="loginSection">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your account
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    required
                >

                <button type="submit">
                    Login
                </button>

                <p id="message"></p>

            </form>

            <p>
                Don't have an account?
                <a href="#" id="showRegister">
                    Register
                </a>
            </p>

        </div>


        <!-- REGISTER -->

        <div
            id="registerSection"
            class="hidden"
        >

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your account
            </p>

            <form id="registerForm">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

                <label for="regEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="regEmail"
                    required
                >

                <label for="regPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="regPassword"
                    required
                >

                <button type="submit">
                    Register
                </button>

                <p id="registerMessage"></p>

            </form>

            <p>
                Already have an account?
                <a href="#" id="showLogin">
                    Login
                </a>
            </p>

        </div>

    </main>


    <script src="app.js"></script>

</body>

</html>
